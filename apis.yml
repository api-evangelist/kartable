aid: kartable
name: Kartable
description: 'Kartable is a French online education platform (edtech) delivering standards-aligned
  learning for students from primary through secondary school (CE1 to Terminale, ages 6-18).
  It provides more than 1,000 course summaries, thousands of corrected exercises, and quizzes
  across 16 subjects including mathematics, French, history, physics, and languages, authored
  by teachers from the French Education Ministry. Its "Alfa" AI tutor answers questions 24/7,
  generates custom quizzes from photos of coursework, and guides students through homework,
  while parents follow progress from a dedicated dashboard. Kartable is a consumer subscription
  product (from EUR 7.99/month) and does not publish a public developer API. Backed by Partech.'
